# Tests the API and deploys it to Cloud Run on every push to main that touches
# backend/. Authenticates with Workload Identity Federation, so no
# service-account key is stored in GitHub.
#
# The service's env vars, sizing (1 vCPU, 512Mi, min 0 / max 1 instances) and
# public access live on the Cloud Run service itself; this only ships a new
# image, and every new revision keeps them. Change them with
# `gcloud run services update simplyodd-api --region asia-south1 ...` or in the
# console (Cloud Run → simplyodd-api → Edit & deploy new revision).
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  PROJECT_ID: simply-odd
  REGION: asia-south1
  SERVICE: simplyodd-api
  IMAGE_REPO: asia-south1-docker.pkg.dev/simply-odd/simplyodd/simplyodd-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/18861122418/locations/global/workloadIdentityPools/github/providers/github
          service_account: simplyodd-deployer@simply-odd.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE_REPO:$GITHUB_SHA" backend
          docker push "$IMAGE_REPO:$GITHUB_SHA"

      - name: Deploy to Cloud Run
        run: gcloud run deploy "$SERVICE" --image "$IMAGE_REPO:$GITHUB_SHA" --region "$REGION" --project "$PROJECT_ID" --quiet

      - name: Health check
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format 'value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$URL/api/health"
          echo "Deployed: $URL"
