# Render Blueprint for the Simply Odd API.
# Dashboard → New → Blueprint → pick this repo. Values marked `sync: false`
# are prompted for on first deploy and never stored in git.
services:
  - type: web
    name: simplyodd-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENV
        value: production
      - key: ALLOW_DEV_AUTH
        value: "false"
      # Render's disk is ephemeral, so production data must live in Firestore.
      - key: DATA_BACKEND
        value: firestore
      - key: SEED_DEMO_DATA
        value: "false"
      - key: MEMORY_PERSIST_PATH
        value: ""
      # Your frontend URL(s), comma-separated, e.g. https://simplyodd.netlify.app
      - key: CORS_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Paste the full service-account JSON (or its base64).
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      # Product images go to Google Drive (values from scripts/drive_auth.py).
      - key: MEDIA_BACKEND
        value: drive
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: PAYMENT_PROVIDERS
        value: razorpay,cod
